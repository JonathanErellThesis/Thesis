[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recsys-edge-reproduction"
version = "0.1.0"
description = "Anonymous reproduction code for a sketch-based edge recommender."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
