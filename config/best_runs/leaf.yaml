model_name: LEAF

best_runs:
  "100K":
    seed: 42
    device: cuda

    eval:
      eval_top_ks: [2, 3, 5, 7, 10, 15]
      relevance_thresholds: [4, 5]
      use_clip_rmse: true
      rmse_clip_bounds: [1.0, 5.0]

    params:
      online_inference_pred_type: per_user
      train_on_user_residuals: false
      sketch:
        item_top_pct: 0.05
        user_top_pct: 0.08
        refresh_every: 5

    model_init:
      loss_type: residual_mse
      embedding_size: 8
      k: 3
      M_u_f: 47
      M_u_inf: 188
      M_i_f: 269
      M_i_inf: 572

    model_hps:
      leaf_approach: paper
      lr: 0.001
      lr_incremental: 0.0001
      weight_decay: 0.00005
      weight_decay_incremental: 0.0001
      batch_size: 128
      epochs_offline: 100
      epochs_incremental: 75
      incremental_batch_size: 128
      patience: 8
      incremental_patience: 10
      use_bias: true
      online_mode: ridge_prior
      incremental_mode: sgd
      incremental_freeze_mode: train_items_plus_global
      incremental_update_sketch: false
      neighbor_top_k: 20
      ridge_lambda_factors: 0.001
      ridge_lambda_user_bias: 0.001

